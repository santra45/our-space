<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      DEFENCE IN DEPTH ONLY. The authoritative Content-Security-Policy is the
      HTTP response header set in vercel.json. This meta tag repeats it so the
      policy still applies when the build is opened from static hosting that
      sends no headers at all (a dragged-and-dropped dist/ folder, file://,
      `vite preview`). `frame-ancestors` is deliberately absent here: a meta-tag
      CSP cannot express it and browsers log a warning when it tries. Clickjacking
      is stopped by the header plus X-Frame-Options: DENY, both in vercel.json.
      If you change one policy, change the other.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' wss://*.peerjs.com https://*.peerjs.com stun: stuns:; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No apple-touch-icon: iOS ignores SVG icons and the PNG set has not been
      generated yet, so linking one would be a guaranteed 404 on every load.
      See the icon note in the README before adding it back.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffe8ed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Our Space" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Our private, end-to-end encrypted space for two." />
    <link rel="manifest" href="/manifest.json" />

    <title>Our Space 💕</title>
  </head>
  <body class="bg-gradient-to-b from-blush-50 via-cream-50 to-lavender-50 min-h-screen text-slate-800 antialiased selection:bg-blush-200 selection:text-blush-600 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
