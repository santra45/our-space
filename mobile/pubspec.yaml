name: our_space_mobile
description: "A private, zero-knowledge, offline-first mobile sanctuary for two people."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.2.1

  cryptography: ^2.5.0
  crypto: ^3.0.6

  sqflite: ^2.4.1
  path: ^1.9.1

  http: ^1.3.0

  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0
  vibration: ^2.0.0
  file_picker: ^11.0.3
  share_plus: ^10.1.4

  intl: ^0.20.2
  provider: ^6.1.2
  unorm_dart: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/svg/icons/
    - assets/fonts/caveat/OFL.txt

  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/caveat/Caveat-Latin-Regular.ttf
          weight: 400
    - family: CaveatLatinExt
      fonts:
        - asset: assets/fonts/caveat/Caveat-LatinExt-Regular.ttf
          weight: 400
