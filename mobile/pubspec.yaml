name: our_space_mobile
description: "A private, zero-knowledge, offline-first mobile sanctuary for two people."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  cryptography: ^2.5.0
  cryptography_flutter: ^2.3.4
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  sqflite: ^2.4.1
  path: ^1.9.1

  flutter_webrtc: ^1.6.2+hotfix.3
  http: ^1.3.0
  web_socket_channel: ^3.0.1

  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0
  vibration: ^2.0.0
  file_picker: ^11.0.3
  share_plus: ^10.1.4

  google_fonts: ^6.2.1
  confetti: ^0.8.0
  intl: ^0.20.2
  provider: ^6.1.2
  lucide_icons: ^0.257.0
  unorm_dart: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
