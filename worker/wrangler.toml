name = "our-space-mailbox"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Workers KV, because it is part of the Workers free plan and needs NO payment
# method on file. R2 has a much larger free tier - 10GB against KV's 1GB - but
# Cloudflare makes you link a card to activate it even so, which is an absurd
# thing to ask of someone setting this up for two people who will never get
# near any limit.
#
# Create it, then paste the id it prints here:
#   npx wrangler kv namespace create MAILBOX
#
# What the free tier gives you: 1GB of storage, 100,000 reads a day and 1,000
# writes a day. A publish writes only the records that actually changed plus one
# manifest, so ordinary use is a handful of writes. The one to keep an eye on is
# storage: a photo record can be 12MB, so roughly a hundred photos fills it. If
# that ever happens the photos simply stop publishing - letters, answers,
# milestones and the rest carry on, and photos still sync phone-to-phone.
[[kv_namespaces]]
binding = "MAILBOX"
id = "ad9ef91476734bf9bdf31fedb4deb496"

# If you would rather use R2 and do not mind linking a card, delete the block
# above and use this instead. The Worker handles either one.
#
# [[r2_buckets]]
# binding = "MAILBOX"
# bucket_name = "our-space-mailbox"

[vars]
# Comma-separated. The Worker refuses any browser origin not on this list rather
# than reflecting whatever Origin the request arrived with, so add your preview
# domain here explicitly if you want one to work.
ALLOWED_ORIGIN = "https://sameskytonight.vercel.app,http://localhost:5173"

# MAILBOX_TOKEN is NOT set here. It is a secret:
#   npx wrangler secret put MAILBOX_TOKEN
#
# Though read the note in src/index.js before treating it as one - the same
# value has to be compiled into the browser bundle, so it is a quota guard
# rather than a password. The unguessable mailbox path is the real control.
